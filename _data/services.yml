- number: "01"
  title: In silico prediction
  description: Computational assessment of toxicity, ADMET and molecular behavior to characterize compounds before experimental testing.
  features:
    - QSAR/QSPR and predictive toxicology
    - ADMET, PBPK and barrier prediction
    - Molecular modeling and applicability-domain analysis

- number: "02"
  title: Human in vitro models
  description: Experimental evaluation in human cellular systems to test biological responses, refine computational hypotheses and generate decision-relevant evidence.
  features:
    - 2D cellular models
    - 3D cellular models
    - Viability and functional endpoints
  image: https://images.pexels.com/photos/3992927/pexels-photo-3992927.jpeg?auto=compress&cs=tinysrgb&w=1200
  image_alt: Cell culture work in a laboratory using multiwell plates and pipetting
  credit_label: CDC / Pexels
