- number: "03"
  title: Integrated evidence & compound prioritization
  description: Integration of in silico predictions, read-across evidence and targeted in vitro results to prioritize compounds and support decisions before more resource-intensive development stages.
  features:
    - Lead prioritization and read-across
    - Computational–experimental evidence integration
    - Go / No-Go support
