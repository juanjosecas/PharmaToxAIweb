{% assign member = include.member %}
<article class="team-card reveal">
  <div class="team-head">
    <div class="avatar">{{ member.initials }}</div>
    <div>
      <h3>{{ member.name }}</h3>
      <p class="team-role">{{ member.role }}</p>
    </div>
  </div>

  <p class="team-expertise">{{ member.expertise }}</p>

  <div class="profile-links">
    {% if member.linkedin and member.linkedin != '' %}<a href="{{ member.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>{% endif %}
    {% if member.conicet and member.conicet != '' %}<a href="{{ member.conicet }}" target="_blank" rel="noopener">CONICET profile</a>{% endif %}
  </div>
</article>
