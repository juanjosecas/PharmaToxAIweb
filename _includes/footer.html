{% assign public_whitepapers = site.whitepapers | where_exp: 'item', 'item.published != false' %}
<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <a class="brand brand-footer" href="{{ '/' | relative_url }}">{% include logo.html %}</a>
      <p>{{ site.data.company.tagline }}</p>
    </div>
    <div class="footer-links">
      <a href="{{ '/publications/' | relative_url }}">Publications</a>
      {% if public_whitepapers.size > 0 %}<a href="{{ '/whitepapers/' | relative_url }}">White papers</a>{% endif %}
      <a href="{{ site.data.company.linkedin }}" target="_blank" rel="noopener">LinkedIn</a>
      <a href="mailto:{{ site.data.company.email }}">Contact</a>
    </div>
    <p class="footer-note">© <span id="year"></span> {{ site.data.company.name }}</p>
  </div>
</footer>
