<header class="site-header" id="top">
  <div class="container nav-wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="PharmaToxAI home">
      {% include logo.html %}
    </a>

    <button class="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation">
      <span></span><span></span><span></span>
    </button>

    <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        <a href="{{ item.url | relative_url }}"{% if item.button %} class="button button-small"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
